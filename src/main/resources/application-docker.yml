# ============================================================
# Docker 환경 설정 (docker-compose 실행 시 사용)
# Oracle DB는 docker-compose의 oracle-db 서비스에 연결
# ============================================================
spring:
  datasource:
    url: jdbc:oracle:thin:@oracle-db:1521/FREEPDB1
    username: WASISSGA
    password: agssisaw2021!
    driver-class-name: oracle.jdbc.OracleDriver

    hikari:
      pool-name: DockerHikariPool
      minimum-idle: 2
      maximum-pool-size: 10
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1 FROM DUAL
      auto-commit: false

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

logging:
  level:
    com.example.egov: INFO
    org.hibernate.SQL: INFO
    org.egovframe: INFO
